services:
  db:
    # Same major version as the development server, so pg_dump output from
    # development restores cleanly (PG18 dumps do not load into older servers).
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # postgres:18 keeps its data in /var/lib/postgresql/18/docker
      - odoo-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  odoo:
    build: .
    image: erp-odoo:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ODOO_DB_HOST: db
      ODOO_DB_PORT: 5432
      ODOO_DB_USER: ${POSTGRES_USER:-odoo}
      ODOO_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ODOO_DB_NAME: ${ODOO_DB_NAME:-erp}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?Set ODOO_ADMIN_PASSWORD in .env}
      ODOO_WORKERS: ${ODOO_WORKERS:-3}
      ODOO_MAX_CRON_THREADS: ${ODOO_MAX_CRON_THREADS:-1}
      ODOO_LIMIT_MEMORY_SOFT: ${ODOO_LIMIT_MEMORY_SOFT:-671088640}
      ODOO_LIMIT_MEMORY_HARD: ${ODOO_LIMIT_MEMORY_HARD:-805306368}
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-True}
      ODOO_LIST_DB: ${ODOO_LIST_DB:-False}
      ODOO_LOG_LEVEL: ${ODOO_LOG_LEVEL:-info}
      ODOO_INIT_MODULES: ${ODOO_INIT_MODULES:-}
      ODOO_LOAD_LANGUAGE: ${ODOO_LOAD_LANGUAGE:-id_ID,en_US}
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8017}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT:-8072}:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  odoo-db-data:
  odoo-web-data:
